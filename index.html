<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>こもれび館｜ミカ過去編 シナリオプレビュー</title>
<!-- Standalone Pages preview: all styling is self-contained. -->
<style>
html,body{margin:0;min-height:100%;background:#18141c;color:#fff;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
#preview{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 55% 35%,#4b364d,#211c28 70%);cursor:pointer}
.scene-place{position:absolute;top:5%;left:5%;z-index:2;font-size:clamp(13px,1.35vw,18px);letter-spacing:.13em;color:#f6d9e7;padding:12px 16px;border-left:3px solid #d995b5;background:#100e1977}
.scene-note{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:clamp(13px,2vw,25px);color:#dbd0d8;letter-spacing:.13em;text-align:center;opacity:.6}
.scene-dialog{position:absolute;bottom:5%;left:13%;right:13%;min-height:24%;box-sizing:border-box;background:rgba(254,232,242,.9);border:2px solid #fffc;border-radius:23px;box-shadow:0 10px 35px #130c1c88;padding:clamp(27px,3vw,46px) clamp(22px,4vw,60px);color:#483044}
.scene-speaker{position:absolute;top:-21px;left:30px;padding:8px 32px;background:#c883a6;border:2px solid #fff;border-radius:35px;color:#fff;font-size:clamp(13px,1.4vw,19px);font-weight:bold}
.scene-dialog p{font-size:clamp(16px,1.8vw,25px);font-weight:650;line-height:1.7;white-space:pre-wrap;margin:0;max-height:27vh;overflow-y:auto}
.scene-progress{position:absolute;bottom:12px;right:23px;font-size:12px;color:#78556f}
.scene-dialog.narration{background:rgba(34,26,43,.91);color:#f6e9f0;border-color:#aa91a9}
.scene-dialog.narration p{font-weight:500}
#back{position:absolute;top:5%;right:5%;z-index:8;border:1px solid #fbdde8;border-radius:30px;padding:9px 18px;color:#fff;background:#352a3ea8;cursor:pointer}
#intro{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#211925b8;z-index:4}
#intro h1{font-size:clamp(25px,4vw,50px);margin:10px}
#intro small{letter-spacing:.2em;color:#ecbdd5}
#intro p{font-size:13px;color:#f3dce9}
#start{margin:24px auto;border:1px solid #fff;background:#bb789c;color:white;border-radius:28px;padding:12px 34px;cursor:pointer}
@media(max-height:470px){.scene-dialog{bottom:2%;min-height:30%;padding:23px 24px 10px}.scene-dialog p{font-size:15px}.scene-place{top:3%}}

#reader-bar{position:absolute;z-index:12;top:15px;right:15px;display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;max-width:74%}
#reader-bar #back{position:static;top:auto;right:auto;z-index:auto}
#reader-bar button{background:#32273cca;color:#fff;border:1px solid #eed5e4;border-radius:18px;padding:8px 11px;font-size:12px;cursor:pointer;touch-action:manipulation}
#reader-bar button[aria-pressed="true"]{background:#bd769e}
#chapter{position:absolute;inset:0;z-index:7;display:none;place-content:center;text-align:center;background:linear-gradient(145deg,#171621,#533547 60%,#231824);padding:30px}
#chapter .part{color:#e9becf;font-size:clamp(14px,2vw,19px);letter-spacing:.2em}
#chapter h2{font-size:clamp(27px,4.8vw,58px);line-height:1.4;margin:25px 0 5px}
#chapter .subtitle{color:#e5c9d8;letter-spacing:.16em;font-size:clamp(13px,2vw,20px)}
#chapter .hint{font-size:13px;color:#e8d7e1;margin-top:38px}
#endcard{position:absolute;inset:0;z-index:9;display:none;place-content:center;background:#241b2d;text-align:center;padding:30px}
#endcard h2{font-size:32px}
#endcard button{background:#bb789c;border:1px solid white;color:#fff;padding:12px 24px;border-radius:25px;cursor:pointer}
#preview[data-mode="chapter"] .scene-note,#preview[data-mode="chapter"] .scene-place,#preview[data-mode="chapter"] .scene-dialog{visibility:hidden}
.scene-note{pointer-events:none}
.scene-dialog{pointer-events:none}
@media(max-width:650px){.scene-dialog{left:4%;right:4%;bottom:4%;min-height:25%;padding:30px 19px 26px}.scene-speaker{left:17px}#reader-bar{max-width:100%;left:8px;right:8px;top:8px;justify-content:center}#reader-bar button{font-size:11px;padding:7px 9px}.scene-place{top:52px;left:10px;font-size:12px;padding:8px 10px}}

/* Chapter reader / layered art assets */
#preview{background:linear-gradient(130deg,#37263e,#1c1a28)}
.scene-backdrop{position:absolute;inset:0;background:radial-gradient(ellipse at 45% 40%,#594057,#211c28);background-size:cover;background-position:center;z-index:0}
.scene-backdrop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
.scene-backdrop img[hidden]{display:none!important}
.scene-backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,#0b10191a 5%,transparent 32%,#12102045 100%);pointer-events:none}
.mika-portrait{position:absolute;z-index:1;bottom:-10%;left:50%;transform:translateX(-50%);height:110%;width:auto;max-width:82%;object-fit:contain;object-position:center bottom;pointer-events:none;filter:drop-shadow(0 7px 18px #150e2370)}
.mika-portrait[hidden]{display:none!important}
.scene-place{z-index:2;top:60px;left:18px;pointer-events:none}
#dialog{z-index:5}
#reader-bar{z-index:14}
#reader-bar #toc{background:#704b6baa}
#chapter-menu{position:absolute;inset:0;z-index:15;display:grid;place-items:center;background:#130e1fdc;padding:30px;box-sizing:border-box;cursor:default}
#chapter-menu[hidden]{display:none}
.menu-panel{width:min(760px,100%);max-height:82vh;overflow:auto;box-sizing:border-box;padding:22px 26px;background:#32283c;color:#fff;border-radius:18px;border:1px solid #af87a9;box-shadow:0 20px 50px #0007}
.menu-panel p{color:#e8cddd;font-size:13px}
.menu-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.menu-head h2{margin:0;font-size:23px}
#close-menu{background:#513d53;border:1px solid #c6a2bb;color:#fff;padding:10px;border-radius:10px;cursor:pointer}
#chapter-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:7px;margin-top:15px}
#chapter-list button{background:#f7e8f0;color:#4a3044;border:1px solid #ddbacf;padding:13px;text-align:left;border-radius:10px;cursor:pointer;font-size:13px}
#chapter-list button.current{border-color:#c888a6;background:#fbd0e6;font-weight:700}
#chapter-list button:hover{background:#fff}
#chapter-list span{display:block;color:#6d4f65;font-size:11px;margin-bottom:5px}
.scene-note{font-size:13px;z-index:2;background:#221929dd;padding:10px 15px;border-radius:9px;max-width:75%;text-align:center}
#preview[data-mode="chapter"] .mika-portrait,#preview[data-mode="intro"] .mika-portrait,#preview[data-mode="end"] .mika-portrait{visibility:hidden}
@media(max-width:650px){.mika-portrait{height:100%;bottom:4%;max-width:110%}.scene-place{left:8px;top:45px;max-width:65%;font-size:11px}#reader-bar{justify-content:flex-end;left:2px;right:2px}#reader-bar button{font-size:10px;padding:6px 7px}.menu-panel{padding:15px}#chapter-list{grid-template-columns:1fr 1fr;gap:5px}#chapter-list button{padding:10px}.scene-dialog{z-index:5}}
/* A single light page sweeps right-to-left over the old scene, then reveals the next.
   The next scene renders under the fully covering sheet at the halfway point. */
#scene-fade{
 position:absolute;top:0;left:0;width:122%;height:100%;z-index:13;
 pointer-events:none;opacity:0;transform:translateX(100%);
 background:linear-gradient(102deg,#96758e 0%,#e8dce5 4%,#fff8f6 16%,#fbf5f4 68%,#e4d1e1 94%,#977a9b 100%);
 clip-path:polygon(3% 0,100% 0,100% 100%,0% 100%);
 box-shadow:-22px 0 38px #160c2780,16px 0 32px #11091b52;
 will-change:transform;
}
#scene-fade::after{
 content:"";position:absolute;inset:0 auto 0 0;width:8%;
 background:linear-gradient(90deg,#46304966,transparent);
 pointer-events:none;
}
#scene-fade.is-visible{opacity:1;animation:page-turn 880ms cubic-bezier(.54,.02,.30,1) both}
@keyframes page-turn{
 0%{transform:translateX(100%) skewY(-1.1deg)}
 46%{transform:translateX(-10%) skewY(0deg)}
 54%{transform:translateX(-10%) skewY(0deg)}
 100%{transform:translateX(-112%) skewY(1.1deg)}
}
@media(prefers-reduced-motion:reduce){#scene-fade.is-visible{animation:none;opacity:0}}
</style></head>
<body><div id="preview" role="main" aria-label="ミカ過去編の仮原稿プレビュー" tabindex="0">
<div class="scene-backdrop" id="backdrop" aria-hidden="true"><img id="scene-bg-img" alt="" hidden></div>
<img id="mika-portrait" class="mika-portrait" alt="ミカの立ち絵" hidden>
<div class="scene-note" id="art-note" hidden></div>
<div id="scene-fade" aria-hidden="true"></div>
<div class="scene-place" id="place"></div>
<div class="scene-dialog" id="dialog" hidden><div class="scene-speaker" id="speaker"></div><p id="text"></p><div class="scene-progress" id="progress"></div></div>
<nav id="reader-bar" aria-label="シナリオ再生操作">
<button id="back" type="button">↺ 最初から</button>
<button id="auto" type="button" aria-pressed="false">▶ オート</button>
<button id="skip" type="button" aria-pressed="false">» スキップ</button><button id="toc" type="button">☷ 章一覧</button>
</nav>
<div id="chapter" aria-live="polite"><span class="part" id="part"></span><h2 id="chapter-title"></h2><span class="subtitle" id="chapter-subtitle"></span><p class="hint">画面をタップして読み始める</p></div>
<section id="chapter-menu" hidden role="dialog" aria-modal="true" aria-label="章一覧">
<div class="menu-panel"><div class="menu-head"><h2>章一覧</h2><button type="button" id="close-menu">× 閉じる</button></div>
<p>読み直したい章を選択してください。</p><div id="chapter-list"></div></div></section>
<div id="endcard"><h2>ここまで</h2><p>収録シーンの再生が終わりました。</p><button id="restart" type="button">最初から</button></div>
<div id="intro"><small>MIKA / PAST ARC · SCENE 01–19 · v3.5</small><h1>ミカ過去編</h1><p>全19章収録（第1章は改稿全文版）· 章一覧／オート／スキップ<br>背景・立ち絵は章タイトルをタップした後に表示<br>仮原稿プレビュー（セーブデータへの影響なし）</p><button id="start">イベントを見る ›</button></div>
</div><script src="./mika_past01_preview.js"></script><script src="./scenes_02_06.js"></script><script src="./scenes_07_19.js"></script>
<script>
'use strict';
const el=id=>document.getElementById(id);
const first=window.KM_MANUSCRIPT_PREVIEWS.mika_past01;
const chapters=[
 {number:1,title:first.title,partNumber:'第一部',partTitle:'まだ、何も失っていない',topic:first.topic,lines:first.lines},
 ...window.KM_MANUSCRIPT_CHAPTERS,
 ...window.KM_MANUSCRIPT_REMAINING
];
if(chapters.length!==19)throw Error('Incomplete past-arc chapters');
const assets={
 BG01:'BG01_school_hallway.webp',BG02:'BG02_stadium_evening.webp',
 BG03:'BG03_locker_entrance.webp',BG04:'BG04_cake_shop_night.webp',
 BG05:'BG05_mika_bedroom_night.webp',BG06:'BG06_stadium_competition.webp',
 BG07:'BG07_stadium_exit_dusk.webp',BG08:'BG08_park_evening.webp',
 BG09:'BG09_hospital_day.webp',BG10:'BG10_cafe_afternoon.webp'
};
const portraits={
 casual:'portrait_mika_casual.webp',
 athletic:'portrait_mika_athletic.webp',
 gothic:'portrait_mika_gothic.webp',
 hospital:'portrait_mika_hospital.webp',
 mother:'portrait_mika_mother.webp'
};
function stageFor(location){
 if(location.includes('競技場・更衣'))return 'BG03';
 if(location.includes('競技場・出口'))return 'BG07';
 if(location.includes('競技場／大会'))return 'BG06';
 if(location.includes('競技場'))return 'BG02';
 if(location.includes('学校')||location.includes('高校'))return 'BG01';
 if(location.includes('ケーキ店'))return 'BG04';
 if(location.includes('ミカの部屋'))return 'BG05';
 if(location.includes('喫茶店'))return 'BG10';
 if(location.includes('公園'))return 'BG08';
 if(location.includes('病室'))return 'BG09';
 return '';
}
function portraitFor(n,location,lineIndex){
 // Scene 08: this adult character is Mika's mother, not Mika herself.
 // Keep her on screen for the hospital-family conversation, then withdraw when Mika appears.
 if(n===8)return lineIndex<14?'mother':'';
 if(n===1)return location.includes('競技場')?'athletic':'gothic';
 if(n===2)return location.includes('更衣')?'athletic':'gothic';
 if(n===3)return 'athletic';
 if(n===4)return 'gothic';
 if(n===5)return 'hospital';
 if(n===6)return location.includes('喫茶店')?'casual':'hospital';
 if(n>=9&&n<=16&&location.includes('病室'))return 'hospital';
 if(n===17&&location.includes('病室'))return 'hospital';
 return '';
}
let ci=0,li=0,mode='intro',place='',playing='',timer=null,menuOpen=false;
let transitioning=false,fadeTimer=null;
let lastArtKey='',lastPortrait='';
const root=el('preview'),bgImage=el('scene-bg-img'),portrait=el('mika-portrait'),note=el('art-note'),sceneFade=el('scene-fade');
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function clearSceneFade(){
 if(fadeTimer!==null){clearTimeout(fadeTimer);fadeTimer=null}
 transitioning=false;sceneFade.classList.remove('is-visible');
}
function beginSceneFade(showNext){
 if(reducedMotion){showNext();return}
 transitioning=true;sceneFade.classList.add('is-visible');
 // The page completely covers the screen from 46%-54% of the 880ms sweep.
 fadeTimer=setTimeout(()=>{
  fadeTimer=null;showNext();
  fadeTimer=setTimeout(()=>{
   fadeTimer=null;sceneFade.classList.remove('is-visible');
   transitioning=false;
   if(playing&&mode==='line'&&!menuOpen)loop();
  },440);
 },440);
}

function cancelAuto(){
 if(timer!==null){clearTimeout(timer);timer=null}
 playing='';el('auto').setAttribute('aria-pressed','false');el('skip').setAttribute('aria-pressed','false');
 el('auto').textContent='▶ オート';el('skip').textContent='» スキップ';
}
function showArtError(message){note.textContent=message;note.hidden=false}
function resetArt(){
 lastArtKey='';lastPortrait='';
 bgImage.hidden=true;bgImage.removeAttribute('src');
 portrait.hidden=true;portrait.removeAttribute('src');
 note.hidden=true;
}
function renderArt(){
 const n=chapters[ci].number;
 const bg=stageFor(place),sprite=portraitFor(n,place,li),key=bg+':'+place;
 if(key!==lastArtKey){
   lastArtKey=key;bgImage.hidden=true;note.hidden=true;
   if(bg){
     const filename=assets[bg];
     bgImage.onload=()=>{if(lastArtKey===key&&mode==='line'){bgImage.hidden=false;note.hidden=true}};
     bgImage.onerror=()=>{if(lastArtKey===key)showArtError('背景の読み込みに失敗: '+filename)};
     bgImage.src='./assets/'+filename;
   }else{
     bgImage.removeAttribute('src');
     showArtError('この場面の背景画像はまだ制作していません');
   }
 }
 if(sprite!==lastPortrait){
   lastPortrait=sprite;portrait.hidden=true;
   if(sprite){
     const filename=portraits[sprite];
     portrait.onload=()=>{if(lastPortrait===sprite&&mode==='line')portrait.hidden=false};
     portrait.onerror=()=>{if(lastPortrait===sprite)showArtError('立ち絵の読み込みに失敗: '+filename)};
     portrait.src='./assets/'+filename;
   }else portrait.removeAttribute('src');
 }
}
function draw(){
 root.dataset.mode=mode;
 el('intro').style.display=mode==='intro'?'grid':'none';
 el('chapter').style.display=mode==='chapter'?'grid':'none';
 el('endcard').style.display=mode==='end'?'grid':'none';
 el('dialog').hidden=mode!=='line';
 if(mode==='chapter'){
  const scene=chapters[ci];
  el('part').textContent=scene.partNumber+'　'+scene.partTitle;
  el('chapter-title').textContent='第'+scene.number+'章　'+scene.title;
  el('chapter-subtitle').textContent='MIKA / PAST ARC';
  portrait.hidden=true;bgImage.hidden=true;return;
 }
 if(mode!=='line'){portrait.hidden=true;bgImage.hidden=true;return}
 const scene=chapters[ci],line=scene.lines[li];
 if(line.place)place=line.place;
 el('place').textContent=place;
 el('dialog').classList.toggle('narration',!line.speaker);
 el('speaker').style.display=line.speaker?'block':'none';
 el('speaker').textContent=line.speaker||'';
 el('text').textContent=line.text||'';
 el('progress').textContent=scene.number+' / '+chapters.length+'章　'+(li+1)+' / '+scene.lines.length+'　タップで進む';
 renderArt();
}
function advance(){
 if(menuOpen||transitioning)return;
 if(mode==='end')return;
 if(mode==='intro'){mode='chapter';draw();return}
 if(mode==='chapter'){li=0;place=chapters[ci].topic;mode='line';draw();return}
 const next=chapters[ci].lines[li+1];
 if(next&&next.place&&next.place!==place&&playing!=='skip'){
  beginSceneFade(()=>{li++;draw()});return;
 }
 li++;
 if(li>=chapters[ci].lines.length){cancelAuto();ci++;if(ci>=chapters.length)mode='end';else mode='chapter';place='';resetArt();draw();return}
 draw();
}
function jump(n){cancelAuto();clearSceneFade();ci=n;li=0;place='';mode='chapter';resetArt();closeMenu();draw()}
function restart(){cancelAuto();clearSceneFade();ci=0;li=0;place='';mode='intro';resetArt();draw()}
function delay(){const line=chapters[ci].lines[li];return Math.min(6500,Math.max(1700,1350+(line.text||'').length*75))}
function loop(){
 if(!playing||mode!=='line'||menuOpen){cancelAuto();return}
 if(transitioning)return;
 timer=setTimeout(()=>{timer=null;if(mode!=='line'){cancelAuto();return}advance();if(playing&&mode==='line'&&!transitioning)loop()},playing==='skip'?95:delay());
}
function toggle(kind){
 if(mode==='intro'||mode==='end'||menuOpen)return;
 if(playing===kind){cancelAuto();return}
 cancelAuto();
 if(mode==='chapter')advance();
 if(mode!=='line')return;
 playing=kind;el(kind).setAttribute('aria-pressed','true');
 el(kind).textContent=kind==='auto'?'Ⅱ オート停止':'■ スキップ停止';loop();
}
function openMenu(){cancelAuto();clearSceneFade();menuOpen=true;el('chapter-menu').hidden=false;const buttons=el('chapter-list').querySelectorAll('button');buttons.forEach((button,i)=>button.classList.toggle('current',i===ci))}
function closeMenu(){menuOpen=false;el('chapter-menu').hidden=true}
const listing=el('chapter-list');
chapters.forEach((scene,i)=>{
 const b=document.createElement('button');b.type='button';
 const small=document.createElement('span');small.textContent=scene.partNumber+'｜'+scene.partTitle;b.appendChild(small);
 b.appendChild(document.createTextNode('第'+scene.number+'章　'+scene.title));
 b.addEventListener('click',event=>{event.stopPropagation();jump(i)});
 listing.appendChild(b);
});
root.addEventListener('click',event=>{if(event.target.closest('button')||menuOpen||transitioning)return;if(playing)cancelAuto();advance()});
el('start').addEventListener('click',event=>{event.stopPropagation();advance()});
el('back').addEventListener('click',event=>{event.stopPropagation();restart()});
el('restart').addEventListener('click',event=>{event.stopPropagation();restart()});
el('auto').addEventListener('click',event=>{event.stopPropagation();toggle('auto')});
el('skip').addEventListener('click',event=>{event.stopPropagation();toggle('skip')});
el('toc').addEventListener('click',event=>{event.stopPropagation();openMenu()});
el('close-menu').addEventListener('click',event=>{event.stopPropagation();closeMenu()});
document.addEventListener('keydown',event=>{
 if(event.repeat)return;
 if(event.key==='Escape'){if(menuOpen)closeMenu();else cancelAuto();return}
 if(menuOpen||transitioning||event.target.closest('button'))return;
 if(event.key.toLowerCase()==='m'){openMenu();return}
 if(event.key.toLowerCase()==='a'){toggle('auto');return}
 if(event.key.toLowerCase()==='s'){toggle('skip');return}
 if(event.key==='Enter'||event.key===' '||event.key==='ArrowRight'){event.preventDefault();if(playing)cancelAuto();advance()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAuto()});
draw();
</script></body></html></html>
