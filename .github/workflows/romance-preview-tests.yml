name: Scenario preview optional romance UI tests
on:
  push:
    branches:
      - feature/optional-romance-preview-20261027
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run preview in Chromium
        run: |
          mkdir -p test-artifacts
          python3 -m http.server 8766 --bind 127.0.0.1 >/tmp/komorebi-preview-http.log 2>&1 &
          node tests/romance-preview-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: romance-preview-screenshots
          path: test-artifacts/
